name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Tests, the native build and the end-to-end tests on each OS. Windows x64 and macOS arm64
  # also package their release archives here.
  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64 tests
          - os: windows-latest
            name: windows-x86_64
            artifact: dd-gui-windows-x86_64
          - os: macos-latest
            name: macos-arm64
            artifact: dd-gui-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # zstd-sys compiles libzstd's C with the runner's own compiler (gcc, clang or MSVC).
      - name: Test
        run: cargo test --release --locked
      - name: Build
        run: cargo build --release --locked
      - name: Version
        id: version
        shell: bash
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Check dd-gui.exe's icon, version info and manifest
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Resolve-Path target/release/dd-gui.exe).Path
          # What Explorer shows in Properties > Details.
          $info = (Get-Item $exe).VersionInfo
          $info | Format-List ProductName, FileDescription, InternalName, OriginalFilename, ProductVersion, FileVersion
          if ($info.ProductName -ne 'DD-GUI') { throw 'dd-gui.exe is missing its version info' }
          if ($info.OriginalFilename -ne 'dd-gui.exe') { throw "OriginalFilename is '$($info.OriginalFilename)'" }
          # The icon, as the shell finds it.
          Add-Type -Namespace Win32 -Name Shell -MemberDefinition '[DllImport("shell32.dll", CharSet = CharSet.Unicode)] public static extern uint ExtractIconEx(string file, int index, IntPtr[] large, IntPtr[] small, uint count);'
          $icons = [Win32.Shell]::ExtractIconEx($exe, -1, $null, $null, 0)
          "icons in dd-gui.exe: $icons"
          if ($icons -lt 1) { throw 'dd-gui.exe has no icon' }
          # Every size of assets/dd-gui.ico, the version strings, exactly one manifest.
          python packaging/windows/check-exe.py $exe
          if ($LASTEXITCODE -ne 0) { throw 'dd-gui.exe failed packaging/windows/check-exe.py' }
      - name: Package dd-gui.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/dd-gui.exe -DestinationPath "dist/dd-gui-${{ steps.version.outputs.version }}-windows-x86_64.zip"

      - name: Bundle DD-GUI.app
        if: runner.os == 'macOS'
        run: |
          version=${{ steps.version.outputs.version }}
          app=target/release/DD-GUI.app
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" dist
          cp target/release/dd-gui "$app/Contents/MacOS/dd-gui"
          cp assets/dd-gui.icns "$app/Contents/Resources/dd-gui.icns"
          sed "s/@VERSION@/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          # Info.plist has to name the files that are there.
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$app/Contents/Info.plist"; }
          test -x "$app/Contents/MacOS/$(plist CFBundleExecutable)"
          test -f "$app/Contents/Resources/$(plist CFBundleIconFile).icns"
          # Ad-hoc signature over the whole bundle, so macOS doesn't call the download "damaged".
          codesign --force --sign - "$app"
          codesign --verify --strict --verbose=2 "$app"
          # ditto keeps the executable bit and the signature; upload-artifact's own zip would not.
          ditto -c -k --keepParent "$app" "dist/dd-gui-$version-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        if: matrix.artifact
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

      # End-to-end tests run the release binary for real, as root / administrator. Each
      # script gets the binary's absolute path as its first argument and in DD_GUI, and
      # runs from the repository root.
      - name: End-to-end tests (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 30
        env:
          DD_GUI: ${{ github.workspace }}/target/release/dd-gui
        run: sudo DD_GUI="$DD_GUI" bash ci/e2e-linux.sh "$DD_GUI"
      - name: End-to-end tests (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 30
        env:
          # The binary as shipped: inside the signed bundle.
          DD_GUI: ${{ github.workspace }}/target/release/DD-GUI.app/Contents/MacOS/dd-gui
        # The runner's bash (not necessarily macOS's old /bin/bash), as root.
        run: sudo DD_GUI="$DD_GUI" "$(command -v bash)" ci/e2e-macos.sh "$DD_GUI"
      - name: End-to-end tests (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 30
        shell: pwsh
        env:
          DD_GUI: ${{ github.workspace }}\target\release\dd-gui.exe
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File ci/e2e-windows.ps1 $env:DD_GUI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # The Linux release binaries: built with zig against glibc 2.28, so they run on any
  # distribution since 2018 or so. fontconfig, X11, Wayland and OpenGL load at runtime.
  linux-release:
    name: linux-${{ matrix.arch }} release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}.2.28
      - name: Check the glibc it needs
        run: |
          bin=target/${{ matrix.target }}/release/dd-gui
          readelf -d "$bin" | grep NEEDED
          need=$(readelf -W --dyn-syms "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n1)
          echo "newest glibc symbol: $need"
          test "$(printf '%s\n' "$need" GLIBC_2.28 | sort -V | tail -n1)" = GLIBC_2.28
      - name: Package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          mkdir -p dist
          tar --owner=0 --group=0 --numeric-owner -C target/${{ matrix.target }}/release \
            -czf "dist/dd-gui-$version-linux-${{ matrix.arch }}.tar.gz" dd-gui
      - uses: actions/upload-artifact@v4
        with:
          name: dd-gui-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # The Linux release binaries on the oldest system they support (Debian 10, glibc 2.28),
  # on real x86_64 and arm64 machines.
  linux-smoke:
    name: linux-${{ matrix.arch }} on Debian 10
    needs: linux-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dd-gui-linux-${{ matrix.arch }}
      - name: Smoke test
        run: |
          tar -xzf dd-gui-*-linux-${{ matrix.arch }}.tar.gz
          docker run --rm -v "$PWD:/w" -w /w debian:10 sh -ec '
            ./dd-gui dd if=/dev/urandom of=a.bin bs=1M count=16 status=none
            ./dd-gui dd if=a.bin of=b.bin bs=4M
            cmp a.bin b.bin
            ./dd-gui copy --mode=zeros --to=z.bin --size=8M
            head -c 8388608 /dev/zero | cmp - z.bin
            ./dd-gui copy --mode=smart --from=a.bin --to=a.img.zst
            ./dd-gui copy --mode=restore --from=a.img.zst --to=c.bin
            cmp a.bin c.bin
            gzip -k a.bin
            ./dd-gui copy --mode=restore --from=a.bin.gz --to=d.bin
            cmp a.bin d.bin
            echo PASS
          '

  # Windows on arm64, built and checked on an arm64 machine.
  windows-arm64:
    name: windows-arm64
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked
      - name: Check dd-gui.exe
        shell: pwsh
        run: |
          $exe = (Resolve-Path target/release/dd-gui.exe).Path
          $info = (Get-Item $exe).VersionInfo
          if ($info.ProductName -ne 'DD-GUI') { throw 'dd-gui.exe is missing its version info' }
          if (Get-Command python -ErrorAction SilentlyContinue) {
            python packaging/windows/check-exe.py $exe
            if ($LASTEXITCODE -ne 0) { throw 'dd-gui.exe failed packaging/windows/check-exe.py' }
          }
      - name: Smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path target/release/dd-gui.exe).Path
          # dd-gui.exe is a GUI-subsystem exe: PowerShell only waits for it when its output is piped.
          function Run { & $exe @args | Out-Host; if ($LASTEXITCODE -ne 0) { throw "dd-gui.exe $args failed: $LASTEXITCODE" } }
          $bytes = New-Object byte[] (16MB); (New-Object Random 7).NextBytes($bytes)
          [IO.File]::WriteAllBytes("$PWD\a.bin", $bytes)
          Run dd "if=$PWD\a.bin" "of=$PWD\b.bin" bs=4M
          if ((Get-FileHash a.bin).Hash -ne (Get-FileHash b.bin).Hash) { throw 'dd copy differs' }
          Run copy --mode=smart "--from=$PWD\a.bin" "--to=$PWD\a.img.zst"
          Run copy --mode=restore "--from=$PWD\a.img.zst" "--to=$PWD\c.bin"
          if ((Get-FileHash a.bin).Hash -ne (Get-FileHash c.bin).Hash) { throw 'smart copy differs' }
          'PASS'
      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/dd-gui.exe -DestinationPath "dist/dd-gui-$version-windows-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dd-gui-windows-arm64
          path: dist/*
          if-no-files-found: error

  # dd-gui.exe cross-built from Linux with MinGW, so that keeps working (build.rs embeds the
  # icon with x86_64-w64-mingw32-windres there).
  windows-gnu-cross:
    name: dd-gui.exe cross-built on Linux (MinGW)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Build
        env:
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: cargo build --release --locked --target x86_64-pc-windows-gnu
      - name: Check dd-gui.exe's icon, version info and manifest
        run: python3 packaging/windows/check-exe.py target/x86_64-pc-windows-gnu/release/dd-gui.exe
