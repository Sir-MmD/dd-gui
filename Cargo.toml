[package]
name = "dd-gui"
version = "0.1.0"
edition = "2024"
# sevenz-rust2 needs 1.93 (Slint 1.92); build.sh, build.command and build.bat check for it too.
rust-version = "1.93"
description = "A simple, good-looking GUI for dd, shipped as a single binary"
repository = "https://github.com/Sir-MmD/dd-gui"
homepage = "https://github.com/Sir-MmD/dd-gui"
build = "build.rs"

[dependencies]
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "software-renderer-path",
    "raw-window-handle-06",
] }
# dd itself (uutils coreutils, MIT) compiled straight into the binary
uu_dd = "0.12"
uucore = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
# Smart images (.img.zst) and .zst restores: the official libzstd. (DD-GUI compresses
# independent frames on its own threads, so libzstd's multithreading isn't needed.)
zstd = "0.14"
# Other compressed images (`dd-gui copy`).
# gzip decoding (zlib-rs backend), for .gz images and older smart images (.img.gz)
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs", "runtime_detection"] }
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "xz", "optimization"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64"] }
# Image formats (engine/formats)
# bzip2 (pure-Rust libbz2-rs-sys backend), for .bz2 and DMG (UDBZ) chunks
bzip2 = "0.6"
# LZ4 frames
lz4_flex = { version = "0.14", default-features = false, features = ["std", "frame", "safe-decode", "checked-decode"] }
# 7z archives: decoding only (no AES; encrypted archives are refused)
sevenz-rust2 = { version = "0.23", default-features = false, features = ["bzip2", "deflate", "ppmd", "zstd", "lz4"] }
# DMG (ULFO) chunks
lzfse_rust = "0.2"
# DMG: the property list that describes the chunks (src/drives/macos.rs uses it too)
plist = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
] }

[build-dependencies]
slint-build = "1.18"
# dd-gui.exe's manifest (administrator rights), and its icon and version info; build.rs
# uses both for Windows targets only
embed-manifest = "1.5"
winresource = { version = "0.1.31", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

[patch.crates-io]
# Slint 1.18.1's winit backend with one fix: it divided by zero when a monitor reports
# 0 Hz, as Windows may in VMs and remote sessions (see vendor/README.md). Drop this once
# Slint ships the fix.
i-slint-backend-winit = { path = "vendor/i-slint-backend-winit" }
